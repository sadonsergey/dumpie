      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="0.55" stop-color="#F0476B"/>
      <stop offset="1" stop-color="#8A4FD6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="36" height="36" rx="9" fill="url(#frame)"/>
  <rect x="4" y="4" width="32" height="32" rx="7.2" fill="#24262B"/>
  <rect x="8" y="9.5" width="3" height="5.5" rx="1.5" fill="#3FD07A"/>
  <rect x="13.5" y="10.8" width="16.5" height="3" rx="1.5" fill="#E6E8EC"/>
  <rect x="8" y="17.3" width="3" height="5.5" rx="1.5" fill="#FF5C6C"/>
  <rect x="13.5" y="18.6" width="11" height="3" rx="1.5" fill="#E6E8EC"/>
  <path d="M27.6 18.7 L32 18.7 L29.8 21.8 Z" fill="#E6E8EC" stroke="#E6E8EC" stroke-width="0.6" stroke-linejoin="round"/>
